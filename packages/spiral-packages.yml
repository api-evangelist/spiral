note: >-
  Spiral (SpiralDB) is a pre-access multimodal data warehouse with no public product API yet.
  Its first-party developer surface is the open-source Vortex columnar-data ecosystem and the
  compression libraries it authors. Packages below are verified as authored under the spiraldb
  GitHub org / Vortex Authors. fsst is intentionally omitted because that crates.io crate now
  belongs to the lance-format org, not SpiralDB.
