name: Spiral
description: >-
  Spiral (SpiralDB) is a multimodal data platform built for the "machine consumer" — frontier AI
  systems and agents. It unifies video, images, audio, embeddings, point clouds, sensor streams,
  tables, and text under one query language and coordinate-frame system, serving everything from
  raw bytes to model-ready tensors at machine-scale throughput for pretraining pipelines and
  agentic access. Spiral is the creator of Vortex, a high-performance extensible columnar data
  format (100x faster random access and 10-20x faster scans vs. Apache Parquet) now incubating
  under the Linux Foundation, along with the FastLanes, FSST, and ALP compression libraries. The
  hosted Spiral warehouse is currently invite-only (Request Access); the public developer surface
  today is the open-source Vortex ecosystem (Python and Rust bindings). Backed by Amplify Partners
  and General Catalyst.
